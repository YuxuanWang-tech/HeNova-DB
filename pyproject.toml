[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "henova"
version = "0.1.0"
description = "Analysis pipeline for helium nova candidates — light curves, ejecta velocities, H-deficiency diagnostics"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "astropy>=6.0",
    "matplotlib>=3.8",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "jupyter>=1.0",
    "ipykernel",
    "nbconvert",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["henova*"]
